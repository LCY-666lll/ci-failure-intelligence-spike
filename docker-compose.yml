services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.2
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql+asyncpg://spike:spike@postgres:5432/spike
      QDRANT_URL: http://qdrant:6333
      INGEST_HMAC_SECRET: local-development-secret-with-32-characters
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres-data:
  qdrant-data:

