[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deployment-feasibility-spike"
version = "0.1.0"
description = "Zero-cost deployment feasibility spike for CI failure intelligence"
requires-python = ">=3.11,<3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.15,<1.16",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ci_failure_spike"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

